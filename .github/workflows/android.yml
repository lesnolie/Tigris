name: Android CI

on:
  push:
    branches:
      - main
      - feat/xiaomi-home-diagnostics
    paths:
      - 'app/**'
      - 'install.sh'
      - 'tools/installation_strategy.py'
      - 'tools/installation_strategies.json'
      - 'tools/install-plan.py'
      - 'tools/test_installation_strategy.py'
      - 'tools/test-install.sh'
      - 'tools/check-install.py'
      - 'tools/test_install_check.py'
      - 'tools/tv-replacement.py'
      - 'tools/replacement_profiles.py'
      - 'tools/test_tv_replacement.py'
      - 'tools/xiaomi_home.py'
      - 'tools/test_xiaomi_home.py'
      - 'tools/download-release.py'
      - 'tools/test_release_download.py'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'install.sh'
      - 'tools/installation_strategy.py'
      - 'tools/installation_strategies.json'
      - 'tools/install-plan.py'
      - 'tools/test_installation_strategy.py'
      - 'tools/test-install.sh'
      - 'tools/check-install.py'
      - 'tools/test_install_check.py'
      - 'tools/tv-replacement.py'
      - 'tools/replacement_profiles.py'
      - 'tools/test_tv_replacement.py'
      - 'tools/xiaomi_home.py'
      - 'tools/test_xiaomi_home.py'
      - 'tools/download-release.py'
      - 'tools/test_release_download.py'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already provides Android command-line tools. Do not invoke
      # setup-android@v3: it tries to install the obsolete SDK package "tools".
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate locale resources and format placeholders
        run: python3 tools/test_i18n.py

      - name: JVM unit tests - standard and guard
        run: bash ./gradlew --no-daemon :app:testStandardDebugUnitTest :app:testGuardDebugUnitTest --stacktrace

      - name: Installer safety and restore contracts
        run: bash tools/test-install.sh

      - name: Test versioned release downloader
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Build both release APK flavors
        run: bash ./gradlew --no-daemon :app:assembleStandardRelease :app:assembleGuardRelease --stacktrace

      - name: Android lint
        run: bash ./gradlew --no-daemon :app:lintStandardRelease :app:lintGuardRelease --stacktrace

      - name: Upload test reports and built APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-results
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-*
            app/build/outputs/apk/
          if-no-files-found: ignore
          retention-days: 7

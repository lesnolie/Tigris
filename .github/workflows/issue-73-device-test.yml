# Signed standard APK for issue #73 device testing. workflow_dispatch, or a push to
# the PR branch. The runner rewrites version metadata only in its checkout:
# versionName 2.0.16-test73 / versionCode 22 is older than published v2.0.17
# (versionCode 23). UpdatePolicy ignores a hyphen suffix, so 2.0.17-test73 would
# not be offered v2.0.17. This file does not change the committed app version,
# and it does not create a tag or a GitHub Release.
name: Issue 73 signed device test
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/sony-install-confirm-fallback-2f74
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TIGRIS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tigris.keystore"
      - name: Build an older signed standard APK from this branch
        env:
          TIGRIS_KEYSTORE: ${{ runner.temp }}/tigris.keystore
          TIGRIS_STORE_PASSWORD: ${{ secrets.TIGRIS_STORE_PASSWORD }}
          TIGRIS_KEY_PASSWORD: ${{ secrets.TIGRIS_KEY_PASSWORD }}
          TIGRIS_KEY_ALIAS: ${{ secrets.TIGRIS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          text, code_count = re.subn(r"(?m)^(\s*versionCode = )\d+$", r"\g<1>22", text, count=1)
          text, name_count = re.subn(
              r'(?m)^(\s*versionName = ")[^"]+(")$',
              r'\g<1>2.0.16-test73\g<2>',
              text,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"version rewrite failed: code={code_count} name={name_count}")
          path.write_text(text)
          print("Building standard release 2.0.16-test73 versionCode 22")
          PY
          bash ./gradlew --no-daemon :app:assembleStandardRelease
      - name: Verify package identity and official certificate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/standard/release/app-standard-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" | head -n 1 | tee "$RUNNER_TEMP/badging.txt"
          grep -F "name='com.leslie.tvhome'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionCode='22'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='2.0.16-test73'" "$RUNNER_TEMP/badging.txt"
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'android.intent.category.HOME'
          "$TOOLS/apksigner" verify --min-sdk-version 28 --print-certs "$APK" | tee "$RUNNER_TEMP/cert.txt"
          grep -F '7d2b6be8a86ce8981e368dde4920869b90c8206137934a6d1fc89a2d1d1b6114' "$RUNNER_TEMP/cert.txt"
          mkdir -p dist
          cp "$APK" dist/Tigris-2.0.16-test73-standard.apk
          (cd dist && sha256sum Tigris-2.0.16-test73-standard.apk > SHA256-Tigris-2.0.16-test73-standard.txt)
          cat dist/SHA256-Tigris-2.0.16-test73-standard.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tigris-2.0.16-test73-standard
          path: |
            dist/Tigris-2.0.16-test73-standard.apk
            dist/SHA256-Tigris-2.0.16-test73-standard.txt
          retention-days: 14
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tigris.keystore"

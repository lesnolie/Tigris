name: Publish verified signed v2.0.13 after main merge
on:
  push:
    branches: ['main']
    paths: ['docs/releases/v2.0.13.md']
permissions:
  contents: write
concurrency:
  group: release-v2.0.13-once
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TIGRIS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tigris.keystore"
      - name: Test and build signed packages
        env:
          TIGRIS_KEYSTORE: ${{ runner.temp }}/tigris.keystore
          TIGRIS_STORE_PASSWORD: ${{ secrets.TIGRIS_STORE_PASSWORD }}
          TIGRIS_KEY_PASSWORD: ${{ secrets.TIGRIS_KEY_PASSWORD }}
          TIGRIS_KEY_ALIAS: ${{ secrets.TIGRIS_KEY_ALIAS }}
        run: |
          bash tools/test-install.sh
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          bash ./gradlew --no-daemon testStandardDebugUnitTest testGuardDebugUnitTest assembleStandardRelease assembleGuardRelease lintStandardRelease lintGuardRelease
      - name: Verify release identity and checksums
        run: |
          set -euo pipefail
          VERSION="2.0.13"
          test -f "docs/releases/v2.0.13.md"
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/Tigris-v2.0.13.apk"
          cp app/build/outputs/apk/guard/release/app-guard-release.apk "dist/Tigris-guard-v2.0.13.apk"
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            head -n 1 "$RUNNER_TEMP/badging.txt" | grep -F "name='com.leslie.tvhome'" | grep -F "versionName='$VERSION'"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
            grep -F '7d2b6be8a86ce8981e368dde4920869b90c8206137934a6d1fc89a2d1d1b6114' "$RUNNER_TEMP/cert.txt"
          done
          (cd dist && sha256sum "Tigris-v2.0.13.apk" "Tigris-guard-v2.0.13.apk" > "SHA256SUMS-v2.0.13.txt")
      - name: Verify upgrade compatibility with previous official APKs
        run: |
          set -euo pipefail
          OLD_STANDARD=$(python3 tools/download-release.py standard)
          OLD_GUARD=$(python3 tools/download-release.py guard)
          python3 tools/verify-apk-upgrade.py "$OLD_STANDARD" "dist/Tigris-v2.0.13.apk" \
            --tools "$ANDROID_HOME/build-tools/36.0.0" --version "2.0.13" --flavor standard
          python3 tools/verify-apk-upgrade.py "$OLD_GUARD" "dist/Tigris-guard-v2.0.13.apk" \
            --tools "$ANDROID_HOME/build-tools/36.0.0" --version "2.0.13" --flavor guard
      - name: Publish signed v2.0.13 exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.13 >/dev/null 2>&1; then
            echo "v2.0.13 already exists; refusing to overwrite" >&2
            exit 1
          fi
          # This creates the version tag only after signature and upgrade verification.
          gh release create v2.0.13 "dist/Tigris-v2.0.13.apk" "dist/Tigris-guard-v2.0.13.apk" "dist/SHA256SUMS-v2.0.13.txt" --target "$GITHUB_SHA" --title "Tigris 2.0.13" --notes-file "docs/releases/v2.0.13.md" --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tigris.keystore"

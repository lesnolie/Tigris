name: Publish signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TIGRIS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tigris.keystore"
      - name: Test and build signed packages
        env:
          TIGRIS_KEYSTORE: ${{ runner.temp }}/tigris.keystore
          TIGRIS_STORE_PASSWORD: ${{ secrets.TIGRIS_STORE_PASSWORD }}
          TIGRIS_KEY_PASSWORD: ${{ secrets.TIGRIS_KEY_PASSWORD }}
          TIGRIS_KEY_ALIAS: ${{ secrets.TIGRIS_KEY_ALIAS }}
        run: |
          bash tools/test-install.sh
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          bash ./gradlew --no-daemon testStandardDebugUnitTest testGuardDebugUnitTest assembleStandardRelease assembleGuardRelease lintStandardRelease lintGuardRelease
      - name: Verify release identity and checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/Tigris-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/guard/release/app-guard-release.apk "dist/Tigris-guard-$GITHUB_REF_NAME.apk"
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            head -n 1 "$RUNNER_TEMP/badging.txt" | grep -F "name='com.leslie.tvhome'" | grep -F "versionName='$VERSION'"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
            grep -F '7d2b6be8a86ce8981e368dde4920869b90c8206137934a6d1fc89a2d1d1b6114' "$RUNNER_TEMP/cert.txt"
          done
          (cd dist && sha256sum "Tigris-$GITHUB_REF_NAME.apk" "Tigris-guard-$GITHUB_REF_NAME.apk" > "SHA256SUMS-$GITHUB_REF_NAME.txt")
      - name: Verify upgrade compatibility with previous official APKs
        run: |
          set -euo pipefail
          OLD_STANDARD=$(python3 tools/download-release.py standard)
          OLD_GUARD=$(python3 tools/download-release.py guard)
          python3 tools/verify-apk-upgrade.py "$OLD_STANDARD" "dist/Tigris-$GITHUB_REF_NAME.apk" \
            --tools "$ANDROID_HOME/build-tools/36.0.0" --version "${GITHUB_REF_NAME#v}" --flavor standard
          python3 tools/verify-apk-upgrade.py "$OLD_GUARD" "dist/Tigris-guard-$GITHUB_REF_NAME.apk" \
            --tools "$ANDROID_HOME/build-tools/36.0.0" --version "${GITHUB_REF_NAME#v}" --flavor guard
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Tigris-$GITHUB_REF_NAME.apk" "dist/Tigris-guard-$GITHUB_REF_NAME.apk" "dist/SHA256SUMS-$GITHUB_REF_NAME.txt" \
            --verify-tag --title "Tigris ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tigris.keystore"

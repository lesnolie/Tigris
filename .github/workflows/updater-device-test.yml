name: Signed updater device test
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/updater-device-test.yml'
      - 'app/src/main/java/com/leslie/tvhome/UpdateActivity.kt'
      - 'app/build.gradle.kts'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TIGRIS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tigris.keystore"
      - name: Build and test
        env:
          TIGRIS_KEYSTORE: ${{ runner.temp }}/tigris.keystore
          TIGRIS_STORE_PASSWORD: ${{ secrets.TIGRIS_STORE_PASSWORD }}
          TIGRIS_KEY_PASSWORD: ${{ secrets.TIGRIS_KEY_PASSWORD }}
          TIGRIS_KEY_ALIAS: ${{ secrets.TIGRIS_KEY_ALIAS }}
        run: |
          RELEASE_TAG="$(git describe --tags --abbrev=0)"
          python3 - "$RELEASE_TAG" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          released = subprocess.check_output(
              ["git", "show", f"{tag}:app/build.gradle.kts"], text=True
          )
          code = re.search(r"(?m)^\s*versionCode = (\d+)$", released)
          name = re.search(r'(?m)^\s*versionName = "([^"]+)"$', released)
          assert code and name, f"Could not read version metadata at {tag}"

          path = Path("app/build.gradle.kts")
          current = path.read_text()
          current, code_count = re.subn(
              r"(?m)^(\s*versionCode = )\d+$", rf"\g<1>{code.group(1)}", current
          )
          current, name_count = re.subn(
              r'(?m)^(\s*versionName = ")[^"]+("$)',
              rf"\g<1>{name.group(1)}-updater-test\g<2>",
              current,
          )
          assert code_count == 1 and name_count == 1, "Expected one Gradle app version"
          path.write_text(current)
          print(f"Building {name.group(1)}-updater-test (versionCode {code.group(1)})")
          PY
          bash ./gradlew --no-daemon testStandardDebugUnitTest testGuardDebugUnitTest assembleStandardRelease lintStandardRelease
      - name: Verify official certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/standard/release/app-standard-release.apk > "$RUNNER_TEMP/cert.txt"
          grep -F '7d2b6be8a86ce8981e368dde4920869b90c8206137934a6d1fc89a2d1d1b6114' "$RUNNER_TEMP/cert.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tigris-updater-device-test
          path: app/build/outputs/apk/standard/release/app-standard-release.apk
          retention-days: 3
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tigris.keystore"
